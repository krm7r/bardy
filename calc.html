<body data-app="calc">
  <header class="top"><button class="mobile-menu-button" type="button" data-menu-open aria-label="فتح قائمة بردي">☰</button><a href="/" class="top-brand"><img class="logo-image" src="/assets/bardy-logo.webp" alt="بردي"></a><span>أدوات بردي</span></header>
  <main class="app-page"><section class="app-hero"><div><p class="app-kicker">أداة يومية</p><h1>الحاسبة</h1><p>احسب العمليات اليومية بسرعة، باستخدام لوحة مفاتيح واضحة أو لوحة المفاتيح في جهازك. سجل العمليات يبقى على جهازك فقط.</p></div><div class="app-hero-icon" aria-hidden="true">🧮</div></section>
    <section class="calc-layout"><section class="app-panel"><div class="calc-display"><div class="calc-expression" id="calc-expression">0</div><div class="calc-result" id="calc-result">0</div></div><div class="keypad" aria-label="لوحة الحاسبة"><button class="key operator" data-key="clear">مسح</button><button class="key operator" data-key="back">⌫</button><button class="key operator" data-key="%">%</button><button class="key operator" data-key="/">÷</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key operator" data-key="*">×</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key operator" data-key="-">−</button><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key operator" data-key="+">+</button><button class="key" data-key="0">0</button><button class="key" data-key=".">.</button><button class="key equals" data-key="=">=</button></div><p id="calc-status" class="app-status" role="status"></p></section><section class="app-panel"><div class="app-panel-head"><h2>آخر العمليات</h2><span class="app-muted">محليًا على جهازك</span></div><div id="calc-history" class="history-list"></div><p class="app-muted" style="margin:15px 0 0">اختصار: استخدم Enter للحساب وEsc للمسح.</p></section></section>
  </main>
